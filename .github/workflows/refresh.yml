name: Refresh listings

# The deployed page is static and holds no API key, so it cannot query
# Ticketmaster itself. This does it instead: re-runs the pipeline on a schedule
# (and on demand from the Actions tab), commits the new data.json, and publishes
# it to gh-pages. The key lives only in repository secrets.

on:
  schedule:
    # 13:00 and 01:00 UTC — 06:00 and 18:00 Pacific.
    - cron: '0 13,1 * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild data.json from the live API
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          if [ -z "$TICKETMASTER_API_KEY" ]; then
            echo "TICKETMASTER_API_KEY secret is not set." >&2
            exit 1
          fi
          npm run build:data

      - name: Commit if the ranking actually changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # generatedAt always differs, so compare everything else. A no-op run
          # should not produce a commit or a redeploy.
          if git diff --quiet -- public/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change."
            exit 0
          fi
          if [ -z "$(git diff -- public/data.json | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -v generatedAt)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only the timestamp moved. Skipping."
            git checkout -- public/data.json
            exit 0
          fi
          git add public/data.json
          git commit -m "Refresh listings ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish to gh-pages
        if: steps.commit.outputs.changed == 'true'
        run: git subtree push --prefix public origin gh-pages
